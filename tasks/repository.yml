---

# Needed for deb822_repository
- name: Install python3-debian
  ansible.builtin.apt:
    pkg: python3-debian
    state: present

- name: Download the Passenger repository signing key
  ansible.builtin.get_url:
    url: "{{ passenger_repo_key_url }}"
    dest: /etc/apt/keyrings/passenger.asc
    owner: root
    group: root
    mode: '0644'

- name: Add Passenger repository
  ansible.builtin.deb822_repository:
    name: passenger
    types: deb
    uris: "{{ passenger_repo_uri }}"
    suites: "{{ passenger_repo_suite }}"
    components: main
    signed_by: /etc/apt/keyrings/passenger.asc
    state: present
  register: passenger_repository

- name: Update apt cache if the Passenger repository changed
  ansible.builtin.apt:
    update_cache: true
  when: passenger_repository is changed # noqa: no-handler
